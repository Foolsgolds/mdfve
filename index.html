<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDFVE - Markdown エディタ ＆ ビューア</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- タブバー -->
      <div id="tab-container" class="tab-container">
        <div id="tab-bar" class="tab-bar">
          <!-- タブが動的に生成されます -->
        </div>
        <button id="btn-add-tab" class="add-tab-btn" title="新しいタブを開く">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- メインワークスペース -->
      <div class="workspace">
        <!-- 目次サイドバー (初期は非表示) -->
        <aside id="outline-sidebar" class="sidebar hidden">
          <div class="sidebar-header">
            <h3>ドキュメント目次</h3>
            <button id="btn-close-sidebar" class="sidebar-close-btn" title="目次を閉じる">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div id="outline-list" class="sidebar-content">
            <!-- 動的に目次が生成されます -->
          </div>
          <div class="sidebar-footer">
            <button id="btn-close-sidebar-bottom" class="sidebar-footer-close-btn" title="目次を閉じる">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>閉じる</span>
            </button>
          </div>
        </aside>

        <!-- エディタパネル -->
        <div class="editor-pane" id="editor-pane">
          <textarea id="editor" placeholder="ここに Markdown を入力してください..." spellcheck="false"></textarea>
        </div>

        <!-- ドラッグ用バー (分割幅リサイザー) -->
        <div class="resizer" id="drag-bar"></div>

        <!-- プレビューパネル -->
        <div class="preview-pane" id="preview-pane">
          <div id="preview" class="markdown-body">
            <!-- レンダリングされた Markdown が入ります -->
          </div>
        </div>
      </div>



      <!-- 画面左下のフローティング目次アイコン -->
      <button id="btn-floating-outline" class="floating-outline-btn" title="目次を表示">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>

      <!-- フローティング メニューバー (command-dock Web Component) -->
      <command-dock id="command-dock"></command-dock>

      <!-- ステータスバー (下部) -->
      <footer class="statusbar">
        <div class="statusbar-left">
          <span id="filepath-display">新規ファイル</span>
        </div>
        <div class="statusbar-center">
          <span id="char-count">0 文字</span>
          <span class="divider">|</span>
          <span id="word-count">0 単語</span>
          <span class="divider">|</span>
          <span id="read-time">読了目安: 0 分</span>
        </div>
        <div class="statusbar-right">
          <span id="content-zoom" title="Ctrl+ホイールで拡大縮小 / Ctrl+0 でリセット">100%</span>
          <span class="divider">|</span>
          <span id="autosave-status" class="status-indicator">自動保存: オフ</span>
          <span class="divider">|</span>
          <span id="active-theme">ダークテーマ</span>
        </div>
      </footer>
    </div>

    <!-- カスタム確認ダイアログ -->
    <div id="custom-dialog-overlay" class="dialog-overlay hidden">
      <div class="dialog-box">
        <div class="dialog-header">
          <h4 id="dialog-title">確認</h4>
        </div>
        <div class="dialog-body">
          <p id="dialog-message">変更内容を保存しますか？</p>
        </div>
        <div class="dialog-footer">
          <button id="btn-dialog-save" class="dialog-btn primary">保存する</button>
          <button id="btn-dialog-discard" class="dialog-btn secondary">保存せずに閉じる</button>
          <button id="btn-dialog-cancel" class="dialog-btn text">キャンセル</button>
        </div>
      </div>
    </div>
  </body>
</html>
